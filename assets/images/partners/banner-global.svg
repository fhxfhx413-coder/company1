<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06101F"/>
      <stop offset=".55" stop-color="#0A192F"/>
      <stop offset="1" stop-color="#142642"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8CF9B"/>
      <stop offset=".5" stop-color="#C8A165"/>
      <stop offset="1" stop-color="#9C7A41"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".5" cy=".5" r=".5">
      <stop stop-color="#C8A165" stop-opacity=".28"/>
      <stop offset="1" stop-color="#C8A165" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop stop-color="#5B84C4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5B84C4" stop-opacity="0"/>
